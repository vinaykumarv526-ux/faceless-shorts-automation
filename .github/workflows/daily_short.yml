name: 24-7 Buffer Auto-Publisher (3 Videos/Day - US Peak Hours)

on:
  schedule:
    # Runs every 2 hours to maintain the rolling 2-day buffer queue
    - cron: '0 */2 * * *'
  workflow_dispatch: # Allows 1-click manual trigger anytime
    inputs:
      videos_to_build:
        description: 'Number of videos to generate and schedule in this run'
        required: false
        default: '1'

permissions:
  contents: write

jobs:
  schedule-buffer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install FFmpeg & Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg wget fonts-inter
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo dpkg -i google-chrome-stable_current_amd64.deb || sudo apt-get -fy install

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy kokoro-onnx faster-whisper google-auth-oauthlib google-api-python-client requests

      - name: Setup AI Models (Kokoro TTS & Whisper)
        run: |
          mkdir -p ~/.faceless-shorts
          python faceless-shorts/scripts/voice.py --download
          python -c "from faster_whisper import WhisperModel; WhisperModel('small.en', device='cpu', compute_type='int8')"

      - name: Check and Maintain 2-Day Schedule Buffer
        env:
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
        run: |
          export PYTHONPATH="faceless-shorts/scripts:automation/pipeline:$PYTHONPATH"
          COUNT="${{ github.event.inputs.videos_to_build || '1' }}"
          python automation/pipeline/buffer_scheduler.py "$COUNT"

      - name: Commit Schedule Buffer State
        run: |
          git config user.name "Buffer Automation Bot"
          git config user.email "bot@users.noreply.github.com"
          git add automation/pipeline/state.json automation/pipeline/topics.json
          git commit -m "chore: update 2-day buffer queue [skip ci]" || echo "No state changes to commit"
          git push
